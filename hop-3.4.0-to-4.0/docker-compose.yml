name: zammad-staging

services:
  zammad-redis:
    image: redis:5
    restart: unless-stopped

  zammad-elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes: [es-data:/usr/share/elasticsearch/data]
    restart: unless-stopped

  zammad-app:
    build: .
    depends_on: [zammad-redis, zammad-elasticsearch]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: 'true'
    volumes:
      - ./database.yml:/opt/zammad/config/database.yml:ro
    command: ["bash", "-c", "rm -f tmp/pids/server.pid; bundle exec rails server -b 0.0.0.0"]
    ports: ["3010:3000"]
    restart: unless-stopped

  zammad-websocket:
    build: .
    depends_on: [zammad-redis, zammad-elasticsearch]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RAILS_ENV: production
    volumes:
      - ./database.yml:/opt/zammad/config/database.yml:ro
    command: ["bash", "-c", "bundle exec ruby script/websocket-server.rb start -b 0.0.0.0 -p 6042"]
    ports: ["127.0.0.1:16043:6042"]
    restart: unless-stopped

  zammad-scheduler:
    build: .
    depends_on: [zammad-redis, zammad-elasticsearch]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RAILS_ENV: production
    volumes:
      - ./database.yml:/opt/zammad/config/database.yml:ro
    command: ["bash", "-c", "bundle exec ruby script/scheduler.rb run"]
    restart: unless-stopped

volumes:
  es-data:
