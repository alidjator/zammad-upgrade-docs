name: zammad-staging

services:
  zammad-redis:
    image: redis:5
    restart: unless-stopped

  # MariaDB versi lama, dipakai untuk staging hop 4.0->6.0 (tetap sama, tidak berubah
  # dari hop sebelumnya). Lihat hop-4.0-to-5.0/NOTES.md untuk alasan lengkap.
  zammad-mariadb-legacy:
    image: mariadb:10.11
    environment:
      # GANTI dengan password asli - jangan pernah commit password sungguhan ke repo.
      # Password asli hanya ada di server (/usr/local/src/zammad-staging/docker-compose.yml).
      MARIADB_ROOT_PASSWORD: __GANTI_DENGAN_ROOT_PASSWORD_ASLI__
      MARIADB_DATABASE: zammad_staging
      MARIADB_USER: zammad_staging
      MARIADB_PASSWORD: __GANTI_DENGAN_PASSWORD_ASLI__
    volumes: [mariadb-legacy-data:/var/lib/mysql]
    restart: unless-stopped

  # Elasticsearch TIDAK berubah versi di hop ini (masih dalam rentang requirement 6.0:
  # >=7.8, <9). Volume "es-data-7" tetap dipakai (data akan di-drop/rebuild ulang oleh
  # searchindex:rebuild, bukan perlu volume baru seperti saat ganti major version ES).
  zammad-elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes: [es-data-7:/usr/share/elasticsearch/data]
    restart: unless-stopped

  zammad-app:
    build: .
    depends_on: [zammad-redis, zammad-elasticsearch, zammad-mariadb-legacy]
    # PostgreSQL target migrasi ada di HOST (bukan container) - butuh host.docker.internal
    # untuk reach dari dalam container. Lihat postgres-migration/NOTES.md.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://zammad-redis:6379
      RAILS_SERVE_STATIC_FILES: 'true'
    volumes:
      - ./database.yml:/opt/zammad/config/database.yml:ro
    command: ["bash", "-c", "rm -f tmp/pids/server.pid; bundle exec rake assets:precompile RAILS_ENV=production; bundle exec rails server -b 0.0.0.0"]
    ports: ["3010:3000"]
    restart: unless-stopped

  zammad-websocket:
    build: .
    depends_on: [zammad-redis, zammad-elasticsearch, zammad-mariadb-legacy]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://zammad-redis:6379
    volumes:
      - ./database.yml:/opt/zammad/config/database.yml:ro
    command: ["bash", "-c", "bundle exec ruby script/websocket-server.rb start -b 0.0.0.0 -p 6042"]
    ports: ["127.0.0.1:16043:6042"]
    restart: unless-stopped

  zammad-scheduler:
    build: .
    depends_on: [zammad-redis, zammad-elasticsearch, zammad-mariadb-legacy]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://zammad-redis:6379
      # script/scheduler.rb di-rename jadi script/background-worker.rb mulai 6.0.0,
      # command CLI-nya juga berubah dari "run" jadi "start". Env var ini penting supaya
      # log tetap muncul di stdout Docker (defaultnya sekarang tidak log ke stdout).
      BACKGROUND_SERVICES_LOG_TO_STDOUT: '1'
    volumes:
      - ./database.yml:/opt/zammad/config/database.yml:ro
    command: ["bash", "-c", "bundle exec ruby script/background-worker.rb start"]
    restart: unless-stopped

volumes:
  es-data-7:
  mariadb-legacy-data:
